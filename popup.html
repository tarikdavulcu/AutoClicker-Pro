<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div class="popup-header">
    <span style="font-size:20px">⚡</span>
    <h3>AutoClicker Pro</h3>
  </div>

  <div class="popup-row">
    <span class="popup-label" data-i18n="language"></span>
    <select class="lang-select" id="langSelect">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="popup-row">
    <span class="popup-label" data-i18n="status"></span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="popup-row">
    <span class="popup-label" data-i18n="activeProfile"></span>
    <span class="popup-value" id="profileName">-</span>
  </div>

  <div class="popup-stat" id="stats"></div>

  <button class="btn btn-danger" id="btnStop" style="width:100%;justify-content:center;margin-top:8px" data-i18n="emergencyStop"></button>

  <div class="popup-links">
    <a href="options.html" target="_blank" id="linkOptions" data-i18n="profileSettings"></a>
    <a href="guide.html" target="_blank" id="linkGuide" data-i18n="howToUse"></a>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
