<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="guideTitle">Kullanım Kılavuzu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="guide-container">
    <div class="opt-header" style="margin-bottom:20px">
      <h2>⚡ AutoClicker Pro - <span data-i18n="guideTitle"></span></h2>
      <select class="lang-select" id="langSelect">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep1Title"></h3>
      <p data-i18n="guideStep1Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep2Title"></h3>
      <p data-i18n="guideStep2Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep3Title"></h3>
      <p data-i18n="guideStep3Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep4Title"></h3>
      <p data-i18n="guideStep4Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep5Title"></h3>
      <p data-i18n="guideStep5Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep6Title"></h3>
      <p data-i18n="guideStep6Desc"></p>
    </div>

    <div class="guide-step">
      <h3 data-i18n="guideStep7Title"></h3>
      <p data-i18n="guideStep7Desc"></p>
    </div>

    <div class="guide-step" style="margin-top:30px; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius);">
      <h3 data-i18n="guideQuickStartTitle"></h3>
      <p data-i18n-html="guideQuickStartHtml"></p>
      <br>
      <p data-i18n-html="guideTimerHtml"></p>
      <p data-i18n-html="guideButtonHtml"></p>
      <p data-i18n-html="guideTargetHtml"></p>
    </div>

    <div class="guide-step" style="margin-top:20px">
      <h3 data-i18n="faqTitle"></h3>
      <p><strong data-i18n="faq1q"></strong><br><span data-i18n="faq1a"></span></p>
      <br>
      <p><strong data-i18n="faq2q"></strong><br><span data-i18n="faq2a"></span></p>
      <br>
      <p><strong data-i18n="faq3q"></strong><br><span data-i18n="faq3a"></span></p>
      <br>
      <p><strong data-i18n="faq4q"></strong><br><span data-i18n="faq4a"></span></p>
      <br>
      <p><strong data-i18n="faq5q"></strong><br><span data-i18n-html="faq5a"></span></p>
      <br>
      <p><strong data-i18n="faq6q"></strong><br><span data-i18n="faq6a"></span></p>
      <br>
      <p><strong data-i18n="faq7q"></strong><br><span data-i18n="faq7a"></span></p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="guide.js"></script>
</body>
</html>
